name: Bug report
description: Something does not work as documented
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `voxar doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error message
      description: Do not attach audio that contains personal data.
      render: text
