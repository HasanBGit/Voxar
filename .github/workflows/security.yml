name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: new advisories appear without code changes

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # gitleaks scans history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Secrets (pre-commit gitleaks hook over the whole tree)
        run: uvx pre-commit run --all-files gitleaks
      - name: Dependency vulnerabilities (OSV via pip-audit)
        run: uv run pip-audit
      - name: Static analysis
        run: >-
          uvx semgrep --config=auto --error voxar tests
          plugins/voxar-tts-espeak/src plugins/voxar-tts-espeak/tests
          --exclude _vendor

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
