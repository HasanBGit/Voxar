// ---- audio helpers: any audio the browser can decode becomes 16 kHz mono 16-bit samples
let sharedContext = null;
function audioContext() {
  // One context for the page's lifetime: creating and closing one per conversion made later decodes stall in testing.
  if (!sharedContext) {
    const Context = window.AudioContext || window.webkitAudioContext;
    try { sharedContext = new Context({ sampleRate: 16000 }); } catch (e) { sharedContext = new Context(); }
  }
  return sharedContext;
}

function withTimeout(promise, ms, message) {
  let timer;
  const limit = new Promise((_, reject) => { timer = setTimeout(() => reject(new UserError(message)), ms); });
  return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
}

function resampleLinear(input, from, to) {  // fallback for a browser that ignores the requested sample rate
  const out = new Float32Array(Math.max(1, Math.round(input.length * to / from)));
  const ratio = from / to;
  for (let i = 0; i < out.length; i++) {
    const position = i * ratio, left = Math.floor(position), right = Math.min(left + 1, input.length - 1);
    out[i] = input[left] + (input[right] - input[left]) * (position - left);
  }
  return out;
}

function toInt16(floats) {
  const out = new Int16Array(floats.length);
  for (let i = 0; i < floats.length; i++) out[i] = Math.max(-1, Math.min(1, floats[i])) * 32767;
  return out;
}

async function toWav16k(arrayBuffer) {
  let decoded;
  try { decoded = await audioContext().decodeAudioData(arrayBuffer); }
  catch (e) { throw new UserError(msg("err_audio")); }
  const channels = [];
  for (let c = 0; c < decoded.numberOfChannels; c++) channels.push(decoded.getChannelData(c));
  let samples = new Float32Array(decoded.length);
  for (let i = 0; i < samples.length; i++) {
    let sum = 0;
    for (const channel of channels) sum += channel[i];
    samples[i] = sum / channels.length;
  }
  if (decoded.sampleRate !== 16000) samples = resampleLinear(samples, decoded.sampleRate, 16000);
  const wav = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const text = (offset, value) => { for (let i = 0; i < value.length; i++) wav.setUint8(offset + i, value.charCodeAt(i)); };
  text(0, "RIFF"); wav.setUint32(4, 36 + samples.length * 2, true); text(8, "WAVE"); text(12, "fmt ");
  wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 1, true);
  wav.setUint32(24, 16000, true); wav.setUint32(28, 32000, true); wav.setUint16(32, 2, true); wav.setUint16(34, 16, true);
  text(36, "data"); wav.setUint32(40, samples.length * 2, true);
  toInt16(samples).forEach((s, i) => wav.setInt16(44 + i * 2, s, true));
  return { blob: new Blob([wav], { type: "audio/wav" }), seconds: samples.length / 16000 };
}

async function transcribeFile(file) {
  setNote(msg("transcribing", { name: file.name }), "working"); setMeta(null); setBusy(true);

    const started = performance.now();
    const response = await fetch("/v1/transcribe", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: blob, signal: AbortSignal.timeout(180000) });
    const body = await response.json();
    if (!response.ok) throw body.error ? new UserError(raw(body.error)) : new UserError(msg("err_failed", { status: response.status }));
    const took = (performance.now() - started) / 1000;
    if (body.text) { transcript.finals.push(body.text); setNote(null); }
    else setNote(msg("no_speech_in", { name: file.name }));
    setMeta(msg("audio_in", { a: seconds.toFixed(1), b: took.toFixed(2) }));
    renderStage();
  } catch (e) {
    setNote(e.name === "TimeoutError" ? msg("err_timeout") : (e.msg || raw(e.message)), "error");
  } finally {
    setBusy(false);
  }
}

function handleFile(file) {

const drop = $("drop");

for (const name of ["dragleave", "drop"]) drop.addEventListener(name, (e) => { e.preventDefault(); drop.classList.remove("over"); });

// ---- live: 16 kHz mono 16-bit frames of 100 ms in, events out, over WS /v1/stream
const LIVE_FRAME = 1600;
let live = null, tickTimer = null;

// wss when the page is https; plain ws only happens on localhost, where https is not available
// nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
function liveUrl() { return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/stream"; }

function setLevel(rms) {
  const bars = $("level").children, strength = Math.min(1, rms * 9);
  for (let i = 0; i < bars.length; i++) {
    const shape = [.55, .85, 1, .85, .55][i];
    bars[i].style.transform = "scaleY(" + (0.12 + 0.88 * strength * shape).toFixed(2) + ")";
  }
}

function renderLiveButton() {
  const button = $("live-start");
  button.classList.toggle("live", !!live);
  if (live) button.innerHTML = '<span class="rec"></span>' + t("stop"); else button.textContent = t("start");
}

function setLiveRunning(running) {
  renderLiveButton();
  $("live-start").disabled = false;
  $("live-file").disabled = running;
  clearInterval(tickTimer);
  if (!running) { setLevel(0); $("elapsed").textContent = ""; return; }
  const began = Date.now();
  const tick = () => { const s = Math.floor((Date.now() - began) / 1000); $("elapsed").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  tick(); tickTimer = setInterval(tick, 500);
}

function liveMeta(session) {
  setMeta(session.firstText === null ? null : msg("first_text", { s: (session.firstText / 1000).toFixed(1) }));
}

function sendFrame(session, frame) {
  const ws = session.ws;
  if (ws.readyState !== WebSocket.OPEN) return;
  if (ws.bufferedAmount > 1 << 20) { session.dropped = true; return; }  // never queue unbounded audio
  ws.send(frame.buffer);
}

function handleLiveEvent(session, event) {
  if (event.error) { session.error = event.error; return; }
  if (session.firstText === null && event.text) { session.firstText = performance.now() - session.began; liveMeta(session); }
  if (event.final) { if (event.text) transcript.finals.push(event.text); transcript.partial = ""; }
  else transcript.partial = event.text;
  renderStage();
}

function endLive(session) {
  if (session.ending) return;
  session.ending = true;
  if (session.source) session.source.stop();
  if (session.ws.readyState === WebSocket.OPEN) session.ws.send("end");  // the server then sends the final line and closes
}

function finishLive(session, closeEvent) {
  if (session.source) session.source.stop();
  if (live === session) live = null;
  setLiveRunning(false);
  transcript.partial = "";
  if (session.error) setNote(raw(session.error), "error");
  else if (session.dropped) setNote(msg("err_dropped"), "error");
  else if (!session.opened) setNote(msg(closeEvent.code === 1013 ? "err_limit" : "err_connect"), "error");
  else if (!session.heard) setNote(msg("no_speech"));
  else setNote(null);
  renderStage();
}

async function startLive(makeSource) {
  if (live) return;
  const session = { ws: new WebSocket(liveUrl()), source: null, firstText: null, began: performance.now(), opened: false, ending: false, error: null, heard: false };
  live = session;
  setLiveRunning(true); setNote(msg("connecting"), "working"); setMeta(null); renderStage();
  session.ws.binaryType = "arraybuffer";
  session.ws.onmessage = (e) => { const event = JSON.parse(e.data); if (event.text) session.heard = true; handleLiveEvent(session, event); };
  session.ws.onclose = (e) => finishLive(session, e);
  session.ws.onopen = async () => {
    session.opened = true; setNote(null); renderStage();
    try {
      session.source = await makeSource((frame) => sendFrame(session, frame), () => endLive(session), setLevel);
      if (session.ending) session.source.stop();
    } catch (e) { session.error = e.message; endLive(session); }
  };
}

async function micSource(send, onEnd, onLevel) {
  if (!navigator.mediaDevices || !window.AudioWorklet) throw new UserError(msg("err_capture"));
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { throw new UserError(msg("err_mic")); }
  const Context = window.AudioContext || window.webkitAudioContext;
  let context;
  try { context = new Context({ sampleRate: 16000 }); } catch (e) { context = new Context(); }
  const code = "class Capture extends AudioWorkletProcessor{constructor(){super();this.parts=[];this.count=0}" +
    "process(inputs){const c=inputs[0][0];if(c){this.parts.push(new Float32Array(c));this.count+=c.length;" +
    "if(this.count>=" + LIVE_FRAME + "){const o=new Float32Array(this.count);let k=0;for(const p of this.parts){o.set(p,k);k+=p.length}" +
    "this.parts=[];this.count=0;this.port.postMessage(o,[o.buffer])}}return true}}registerProcessor('voxar-capture',Capture)";
  const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
  try { await context.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
  const input = context.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(context, "voxar-capture");
  const silent = context.createGain(); silent.gain.value = 0;   // keeps the graph running without playing the mic back
  node.port.onmessage = (e) => {
    const samples = context.sampleRate === 16000 ? e.data : resampleLinear(e.data, context.sampleRate, 16000);
    let sum = 0; for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    onLevel(Math.sqrt(sum / samples.length));
    send(toInt16(samples));
  };
  input.connect(node); node.connect(silent); silent.connect(context.destination);
  return { stop() { stream.getTracks().forEach((t) => t.stop()); try { node.disconnect(); input.disconnect(); } catch (e) {} if (context.state !== "closed") context.close().catch(() => {}); } };
}

function fileSource(file) {
  return async (send, onEnd, onLevel) => {
    const { blob } = await withTimeout(toWav16k(await file.arrayBuffer()), 20000, msg("err_audio_file"));
    const pcm = new Int16Array((await blob.arrayBuffer()).slice(44));
    let position = 0, stopped = false;
    const started = performance.now();
    (async () => {  // paced at real time, like a microphone
      while (!stopped && position < pcm.length) {
        const frame = pcm.slice(position, position + LIVE_FRAME);
        let sum = 0; for (let i = 0; i < frame.length; i++) sum += (frame[i] / 32768) ** 2;
        onLevel(Math.sqrt(sum / frame.length));
        send(frame);
        position += LIVE_FRAME;
        const due = started + (position / 16000) * 1000;
        await new Promise((r) => setTimeout(r, Math.max(0, due - performance.now())));
      }
      if (!stopped) onEnd();
    })();
    return { stop() { stopped = true; } };
  };
}

function toggleLive() {

const MAX_CLIPS = 6;

    play.addEventListener("click", () => { new Audio(clip.url).play().catch(() => {}); });

async function speak() {
  const result = $("tts-result");
  const text = $("text").value.trim();
  result.textContent = ""; view.speakError = null; view.ttsMeta = null; renderTtsMeta();
  if (!text) { showSpeakError(msg("write_first")); return; }
  if (speakAbort) speakAbort.abort();               // a newer request replaces an older one
  const abort = speakAbort = new AbortController();
  speaking = true; $("speak").disabled = true; renderSpeakButton();
  try {
    const started = performance.now();
    const response = await fetch("/v1/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }), signal: AbortSignal.any([abort.signal, AbortSignal.timeout(180000)]) });
    if (!response.ok) { const body = await response.json(); throw body.error ? new UserError(raw(body.error)) : new UserError(msg("err_failed", { status: response.status })); }
    const url = URL.createObjectURL(await response.blob());
